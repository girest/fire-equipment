<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 410" role="img" aria-label="第4類の学習用模式図"><rect width="850" height="410" fill="#fbfcfe"/><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#24364b}.h{font-size:19px;font-weight:700}.s{font-size:15px}.sm{font-size:12px}.a{stroke:#3a5976;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{fill:#e7f0f7;stroke:#7797b0;stroke-width:2}.c{fill:#fff2dd;stroke:#d2a568;stroke-width:2}</style><text x="25" y="36" class="h">平面図：2つの独立した部屋（学習用寸法）</text><rect x="75" y="80" width="288" height="229" fill="#e7f0f7" stroke="#455d74" stroke-width="7"/><text x="182" y="158" class="h">部屋 A</text><text x="164" y="190" class="s">10m × 8m</text><text x="173" y="218" class="s">80㎡</text><rect x="447" y="80" width="320" height="229" fill="#fff2dd" stroke="#455d74" stroke-width="7"/><text x="564" y="158" class="h">部屋 B</text><text x="548" y="190" class="s">12m × 7m</text><text x="561" y="218" class="s">84㎡</text><text x="154" y="344" class="s">独立した感知区域</text><text x="532" y="344" class="s">独立した感知区域</text><text x="18" y="398" class="sm" fill="#7c8794">学習用模式図（実際の機器・製図記号とは異なる）</text></svg>
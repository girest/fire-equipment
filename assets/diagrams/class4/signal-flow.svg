<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="第4類の学習用模式図"><rect width="760" height="280" fill="#fbfcfe"/><style>text{font-family:system-ui,'Noto Sans JP',sans-serif;fill:#24364b}.h{font-size:19px;font-weight:700}.s{font-size:15px}.sm{font-size:12px}.a{stroke:#3a5976;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{fill:#e7f0f7;stroke:#7797b0;stroke-width:2}.c{fill:#fff2dd;stroke:#d2a568;stroke-width:2}</style><text x="28" y="32" class="h">火災報知の信号の流れ</text><rect class="b" x="35" y="75" width="175" height="100" rx="12"/><text x="67" y="115" class="h">A 感知器</text><text x="55" y="143" class="s">煙・熱など</text><path class="a" d="M210 125 H290 m-12 -8 12 8 -12 8"/><rect class="b" x="295" y="75" width="175" height="100" rx="12"/><text x="317" y="115" class="h">B 受信機</text><text x="330" y="143" class="s">表示・制御</text><path class="a" d="M470 125 H553 m-12 -8 12 8 -12 8"/><rect class="b" x="557" y="75" width="175" height="100" rx="12"/><text x="581" y="112" class="h">C 地区音響</text><text x="593" y="143" class="s">館内へ報知</text><rect class="c" x="286" y="191" width="198" height="40" rx="7"/><text x="303" y="218" class="s">発信機からも信号を送れる</text><text x="18" y="268" class="sm" fill="#7c8794">学習用模式図（実際の機器・製図記号とは異なる）</text></svg>
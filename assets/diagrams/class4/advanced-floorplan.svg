<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" role="img" aria-label="事務室と廊下と会議室の平面図。事務室100、会議室90、廊下45平方メートル"><style>text{font-family:system-ui,"Noto Sans JP",sans-serif;fill:#1c3546}.head{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:15px}.room{fill:#eef6fa;stroke:#334b5c;stroke-width:4}.beam{stroke:#c15d36;stroke-width:12}.dash{stroke:#607e96;stroke-width:3;stroke-dasharray:9 6}.wire{stroke:#2d6687;stroke-width:4;fill:none}.box{fill:#f2f5ff;stroke:#406382;stroke-width:3}</style>
